<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js</title>
</head>
<body>
    <h1 class="title">ddd</h1>
    <input type="text">
    <button class="button1">버튼1</button>
    <button class="button2">버튼2</button>
    <ul class="todolist">
    </ul>
</body>
<script>
    const h1 = document.querySelector(".title");
    h1.innerHTML="To-do-list";
    const input = document.getElementsByTagName("input")[0];
    const button1 = document.querySelector(".button1");
    const button2 = document.querySelector(".button2");
    const todolist = document.getElementsByClassName("todolist")[0];
    function addTodo(){
        const li = document.createElement("li");
        li.innerHTML=input.value;
        todolist.appendChild(li);
        input.value="";
    };
    function removeTodo(){
        const list = document.querySelectorAll("li");
        for (const li of list){li.remove()};
    }
    button1.addEventListener("click",addTodo);
    button2.addEventListener("click",removeTodo);
</script>
</html>
