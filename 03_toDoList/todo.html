<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body> 
        <header>
            <h1>TODOLIST</h1>
        </header>
        <main>
            <div class="input_box">
                <input type="text" id="todo_input" placeholder="todo입력...">
                <button id="add_button">추가</button>
                <button id="del_button">삭제</button>
            </div>
            <div class="todo_box">
                <h3>todolist</h3>
                <hr>
                <ol class="todolist">
                </ol>
            </div>
        </main>
</body>
<script>
    const todolist = document.querySelector(".todolist");
    const todoinput = document.querySelector("#todo_input");
    const add_button = document.querySelector("#add_button");
    const del_button = document.querySelector("#del_button");
    function addTodo(){
        const li = document.createElement("li");
        li.innerHTML=todoinput.value;
        todolist.appendChild(li);
        todoinput.value="";
    };
    function delTodo(){
        const li = document.getElementsByTagName("li")[0]
        todolist.removeChild(li);
    };
    add_button.addEventListener("click",addTodo);
    del_button.addEventListener("click",delTodo)
</script>
</html>
