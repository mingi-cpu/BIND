<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mingi quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <h1>mingi quiz</h1>
    <h5 id="clock"></h5>
    <h5 class="hidden" id="realclock"></h5>
    <p id="q"></p>
    <div id="form">
        <button id="o">O</button>
        <button id="x">X</button>
    </div>
    <p id="answer_count">맞춘개수</p>
    <p id="answer">0</p>
    <script>
        const question = document.querySelector("#q");
        const oButton = document.querySelector("#o")
        const xButton = document.querySelector("#x")
        const clock = document.querySelector("#clock");
        const answerNum=document.querySelector("#answer")
        const realClock = document.querySelector("#realclock")
        let answerCount=0
        let seconds = 10;
        let miliSeconds=99;
        let quizNum=0;
        const HIDDEN = 'hidden'
        function time(){
            if (seconds<=0){
                seconds=10;
                miliSeconds=99;
                quiz=quizes[++quizNum]
                question.innerHTML=quiz.q
            }
            if (miliSeconds<=0){
                seconds--;
                miliSeconds=99;
            }
            clock.innerHTML=`${String(seconds).padStart(2,0)}.${String(miliSeconds--).padStart(2,0)}`;
        }
        time()
        setInterval(time,10);
        function end(){
            clock.className=HIDDEN;
            oButton.className=HIDDEN;
            xButton.className=HIDDEN;
            realClock.innerHTML=clock.innerHTML
            realClock.className=''
        }
        function onClickO(){
            if(quizNum>=quizes.length-2){
                end()
            }
            if(quiz.a){
                answerCount++;
                answerNum.innerHTML=answerCount;
            }
            console.log('o')
            console.log(quiz.a)
            seconds+=10;
            quiz=quizes[++quizNum]
            question.innerHTML=quiz.q;
        }
        function onClickX(){
            if(quizNum>=quizes.length-2){
                end()
            }
            if(!quiz.a){
                answerCount++;
                answerNum.innerHTML=answerCount;
            }
            console.log('x')
            console.log(quiz.a)
            seconds+=10;
            quiz=quizes[++quizNum]
            question.innerHTML=quiz.q
        }
        const quizes=[
            {
              q: 'HTML에서 JavaScript를 사용하기 위한 태그는 link 이다?',
              a: false
            },
            {
              q: 'JavaScript에서 배열 요소를 삭제할 때 사용하는 메서드는 push이다?',
              a: false
            },
            {
              q: 'JavaScript에서 id를 통해 요소를 선택하는 메서드는 getElementById이다?',
              a: true
            },
            {
              q: 'JavaScript에서 값을 변경할 수 없는 상수를 선언할 때 const를 사용한다?',
              a: true
            },
            {
              q: 'JavaScript에서 HTML 요소의 내용을 변경할 때 innerText를 사용할 수 있다?',
              a: true
            },
            {
              q: 'JavaScript에서 배열의 길이는 length 속성으로 확인할 수 있다?',
              a: true
            },
            {
              q: 'JavaScript에서 배열의 마지막 요소를 제거할 때 사용하는 메서드는 pop이다?',
              a: true
            },
            {
              q: 'HTML에서 외부 JavaScript 파일을 불러올 때 script 태그를 사용한다?',
              a: true
            },
            {
              q: 'JavaScript에서 조건문은 if 대신 for를 사용해야 한다?',
              a: false
            },
            {
              q: 'JavaScript에서 콘솔에 값을 출력할 때 console.log를 사용한다?',
              a: true
            },
            {
                q:'끝'
            }
        ]
        let quiz=quizes[quizNum]
        question.innerHTML=quiz.q
        oButton.addEventListener('click',onClickO)
        xButton.addEventListener('click',onClickX)
    </script>
</body>
</html>
