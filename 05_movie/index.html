<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Movie</h1>
    <div id="movie_list"></div>
    <script>
        const movieList=[];
        const movieBoxList = document.querySelector("#movie_list");
        async function loadMovieDate(){
            const response = await fetch("https://jsonfakery.com/movies/paginated");
            const jsonData = await response.json();
            console.log(response)
            jsonData.data.forEach(a => {
                movieList.push({
                        name:a.original_title,
                        poster:a.poster_path,
                        casts:a.casts.map(s=>{
                            return s.name
                        })
                    })
            });
            movieList.forEach(a=>{
            const movieBox = document.createElement("div");
            const movieHead = document.createElement("h5");
            const movieCasts = document.createElement("p");
            const poster = document.createElement("img");
            movieHead.innerHTML=a.name;
            if (a.name.length>20){
                movieHead.className="long"
            }
            movieCasts.innerHTML=a.casts[0];
            poster.src=a.poster;
            movieBox.appendChild(movieHead);
            movieBox.appendChild(movieCasts);
            movieBox.appendChild(poster)
            movieBox.className="box"
            movieBoxList.appendChild(movieBox);
        })
        }
        loadMovieDate();
    </script>
</body>
</html>
